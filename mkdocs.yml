site_name: WP Captcha Shield
site_description: Configuration and usage documentation for WP Captcha Shield.
site_url: https://velukuberan.github.io/wp-captcha-shield/
repo_url: https://github.com/velukuberan/wp-captcha-shield
repo_name: velukuberan/wp-captcha-shield
edit_uri: edit/main/docs/

copyright: Copyright &copy; WP Captcha Shield contributors

theme:
  name: null
  custom_dir: custom-theme
  language: en

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
  - Provider setup:
      - Overview: providers/index.md
      - Cloudflare Turnstile: providers/cloudflare-turnstile.md
      - Google reCAPTCHA:
          - General setup: providers/google-recaptcha.md
          - Invisible setup: providers/google-recaptcha-invisible.md
      - hCaptcha: providers/hcaptcha.md
  - Form setup:
      - Overview: forms/index.md
  - Troubleshooting:
      - Troubleshooting: troubleshooting/index.md
