# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: WP Captcha Shield
site_description: Configuration and usage documentation for WP Captcha Shield.
site_url: https://velukuberan.github.io/wp-captcha-shield/
repo_url: https://github.com/velukuberan/wp-captcha-shield
repo_name: velukuberan/wp-captcha-shield
edit_uri: edit/main/docs/

copyright: Copyright &copy; WP Captcha Shield contributors

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
  - Provider setup:
      - Overview: providers/index.md
      - Cloudflare Turnstile: providers/cloudflare-turnstile.md
      - Google reCAPTCHA: providers/google-recaptcha.md
      - hCaptcha: providers/hcaptcha.md
  - Form setup:
      - WordPress login: forms/wordpress-login.md
  - Troubleshooting: troubleshooting/index.md
